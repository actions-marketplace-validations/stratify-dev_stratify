name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: SARIF schema validation
        run: |
          pip install jsonschema==4.*
          cargo build -q -p stratify-cli
          for d in sample-rustcycle sample-dup sample-boundary sample-java sample-complex sample-suppress; do
            target/debug/stratify check crates/stratify-cli/tests/$d --format sarif > /tmp/$d.sarif
          done
          python3 scripts/validate_sarif.py /tmp/*.sarif

      - name: Script tests
        run: |
          bash scripts/test_action_run.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'

      # dogfood: run stratify on its own sample fixtures
      - name: Dogfood
        run: cargo run -p stratify-cli -- check crates/stratify-cli/tests/sample-java
